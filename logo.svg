<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Working Complexity mark">
  <!-- Outer hex: Blueprint Blue — the system -->
  <polygon points="50,2 91.57,26 91.57,74 50,98 8.43,74 8.43,26"
    stroke="#5B9BD5" stroke-width="0.8" fill="none"/>
  <!-- Middle hex: Brass Gold — the working practice -->
  <polygon points="50,26 70.78,38 70.78,62 50,74 29.22,62 29.22,38"
    stroke="#C4A46B" stroke-width="0.8" fill="none"/>
  <!-- Inner hex: Blueprint Blue — the craft -->
  <polygon points="50,38 60.39,44 60.39,56 50,62 39.61,56 39.61,44"
    stroke="#5B9BD5" stroke-width="0.8" fill="none"/>
  <!-- Centre dot: Brass Gold — the person -->
  <circle cx="50" cy="50" r="2.5" fill="#C4A46B"/>
  <!-- Crosshair (include at large sizes; drop below 48px) -->
  <line x1="2" y1="50" x2="98" y2="50"
    stroke="#5B9BD5" stroke-width="0.3" stroke-dasharray="2 3" opacity="0.5"/>
  <line x1="50" y1="2" x2="50" y2="98"
    stroke="#5B9BD5" stroke-width="0.3" stroke-dasharray="2 3" opacity="0.5"/>
</svg>
